<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gems &amp; Jewelry</title>
<meta name="description" content="Handmade wire-wrapped jewelry with natural stones.">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --text: #2a2622; --muted: #6f675e; --line: #e3ddd4;
    --accent: #9a6b2f; --accent-ink: #ffffff; --soft: #efe6d8; --stone: #2a7f86;
    --shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 8px 24px rgba(40, 30, 20, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1916; --card: #24211d; --text: #eee8df; --muted: #a59c90; --line: #3a352f;
      --accent: #d9a35a; --accent-ink: #1b1916; --soft: #2e2924; --stone: #5cc3c9; --shadow: none; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  header { padding: 32px 0 6px; text-align: center; }
  .logo { width: 60px; height: 60px; border-radius: 16px; display: block; margin: 0 auto; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; letter-spacing: .01em;
    font-size: clamp(34px, 8vw, 52px); line-height: 1.05; margin: 12px 0 6px; }
  .tag { color: var(--muted); margin: 0 auto; max-width: 30em; }
  .links { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 18px 0 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
    padding: 0 18px; border-radius: 22px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); text-decoration: none; font: 500 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .filters { display: flex; justify-content: center; gap: 6px; margin: 26px 0 16px; }
  .chip { min-height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-bottom: 40px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card { display: block; width: 100%; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .card:hover .ph img { transform: scale(1.03); }
  .ph { position: relative; aspect-ratio: 4 / 5; background: var(--soft); overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .ph .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .badge { position: absolute; top: 8px; left: 8px; background: rgba(20, 18, 16, .78); color: #fff;
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 10px; letter-spacing: .04em; }
  .card .info { padding: 10px 12px 12px; }
  .card .nm { font-weight: 500; font-size: 15px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .pr { color: var(--accent); font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .card.sold .pr { color: var(--muted); font-weight: 500; }
  .msg { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }

  footer { border-top: 1px solid var(--line); padding: 24px 0 calc(28px + env(safe-area-inset-bottom));
    text-align: center; color: var(--muted); font-size: 14px; }
  footer p { margin: 4px 0; }

  /* piece details */
  dialog { border: 0; padding: 0; background: var(--card); color: var(--text); border-radius: 18px;
    width: min(940px, calc(100vw - 32px)); max-width: none; max-height: calc(100dvh - 32px); overflow: auto; }
  dialog::backdrop { background: rgba(12, 10, 8, .62); }
  @media (max-width: 699px) {
    dialog { width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; }
  }
  .dwrap { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .dwrap { grid-template-columns: 1.1fr 1fr; } }
  .gal { position: relative; background: var(--soft); }
  .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 4 / 5; }
  .slides::-webkit-scrollbar { display: none; }
  .slides img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; display: block; }
  .slides .none { flex: 0 0 100%; display: grid; place-items: center; color: var(--muted); }
  .dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .55); box-shadow: 0 0 2px rgba(0,0,0,.4); }
  .dots i.on { background: #fff; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 20px; border: 0;
    background: rgba(20, 18, 16, .55); color: #fff; font-size: 20px; cursor: pointer; display: none; }
  @media (hover: hover) { .gal.multi .arrow { display: block; } }
  .arrow.l { left: 10px; } .arrow.r { right: 10px; }
  .close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 44px; height: 44px; border-radius: 22px; border: 0;
    background: rgba(20, 18, 16, .6); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
  .dinfo { padding: 20px 20px calc(28px + env(safe-area-inset-bottom)); }
  .dinfo h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1.1; margin: 0 0 6px; }
  .dprice { font-size: 22px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
  .status { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 10px; margin-left: 8px; vertical-align: 3px; }
  .status.available { color: var(--stone); border: 1px solid currentColor; }
  .status.sold { color: var(--muted); border: 1px solid currentColor; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 4px; }
  .desc { white-space: pre-line; }
  .dbtns { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
</style>
</head>
<body>
<header class="wrap">
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1>Gems &amp; Jewelry</h1>
  <p class="tag">Handmade wire-wrapped jewelry with natural stones, each one a one-of-a-kind piece.</p>
  <div class="links">
    <a class="btn" id="igTop" target="_blank" rel="noopener"></a>
    <a class="btn" id="mailTop"></a>
  </div>
</header>

<main class="wrap">
  <div class="filters" role="group" aria-label="Show">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="available">Available</button>
    <button class="chip" data-f="sold">Sold</button>
  </div>
  <div class="grid" id="grid"><p class="msg">Loading pieces…</p></div>
</main>

<footer class="wrap">
  <p>Questions or custom orders? <a id="mailFoot"></a> · <a id="igFoot" target="_blank" rel="noopener"></a></p>
  <p>© <span id="yr"></span> Gems &amp; Jewelry</p>
</footer>

<dialog id="dlg" aria-label="Piece details"></dialog>

<script>
const SB = { url: 'https://wfdtchehoepyrsgfavry.supabase.co', key: 'sb_publishable_2ZEjSCViEP9O_TFbFtC9BQ_lhrXUe-g', bucket: 'jewelry-photos' };
const EMAIL = 'masonwaltetec@gmail.com';
const IG = 'malawindu', IG_URL = 'https://www.instagram.com/' + IG + '/';
const ICON = {
  ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + (Math.round(n * 100) / 100).toFixed(Number.isInteger(+n) ? 0 : 2);
const photoUrl = p => /^(https?:|data:)/.test(p) ? p : `${SB.url}/storage/v1/object/public/${SB.bucket}/${p.split('/').map(encodeURIComponent).join('/')}`;
const mailto = (subject, body) => `mailto:${EMAIL}?subject=${encodeURIComponent(subject)}` + (body ? `&body=${encodeURIComponent(body)}` : '');
const priceText = p => p.price != null && p.price !== '' ? money(+p.price) : 'Ask for price';

let pieces = [], filter = 'all';
try { pieces = JSON.parse(localStorage.getItem('gj_pieces') || '[]'); } catch (e) {}

/* header and footer links */
$('igTop').innerHTML = ICON.ig + '@' + IG; $('igTop').href = IG_URL;
$('mailTop').innerHTML = ICON.mail + 'Email me'; $('mailTop').href = mailto('Gems & Jewelry question');
$('igFoot').textContent = 'Instagram'; $('igFoot').href = IG_URL;
$('mailFoot').textContent = EMAIL; $('mailFoot').href = mailto('Gems & Jewelry question');
$('yr').textContent = new Date().getFullYear();

async function load() {
  try {
    const r = await fetch(`${SB.url}/rest/v1/jewelry_pieces?select=id,name,description,materials,price,status,photos,created_at&published=eq.true&order=created_at.desc`,
      { headers: { apikey: SB.key }, cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    pieces = await r.json();
    try { localStorage.setItem('gj_pieces', JSON.stringify(pieces)); } catch (e) {}
    render();
    fromHash();
  } catch (e) {
    render(pieces.length ? '' : "Couldn't load the pieces right now. Check your connection and try again.");
    fromHash();
  }
}

function render(err) {
  const list = pieces.filter(p => filter === 'all' || p.status === filter);
  const grid = $('grid');
  if (err) { grid.innerHTML = `<p class="msg">${esc(err)}</p>`; return; }
  if (!list.length) {
    grid.innerHTML = `<p class="msg">${pieces.length ? (filter === 'sold' ? 'Nothing sold yet.' : 'Everything has sold. New pieces are on the way!') : 'New pieces are coming soon. Follow along on Instagram.'}</p>`;
    return;
  }
  grid.innerHTML = list.map(p => {
    const ph = (p.photos || [])[0];
    return `<button class="card${p.status === 'sold' ? ' sold' : ''}" data-id="${esc(p.id)}">
      <div class="ph">${ph ? `<img src="${esc(photoUrl(ph))}" alt="${esc(p.name)}" loading="lazy">` : '<div class="none">Photo coming soon</div>'}
        ${p.status === 'sold' ? '<span class="badge">SOLD</span>' : ''}</div>
      <div class="info"><div class="nm">${esc(p.name || 'Untitled piece')}</div>
        <div class="pr">${p.status === 'sold' ? 'Sold' : esc(priceText(p))}</div></div>
    </button>`;
  }).join('');
}

/* piece details (the address gets #p=<id> so the phone's Back button closes it and links can be shared) */
function openPiece(p) {
  const photos = p.photos || [], sold = p.status === 'sold', link = location.origin + location.pathname + '#p=' + p.id;
  const name = p.name || 'Untitled piece';
  const ask = sold
    ? `Hi! I saw "${name}" on your website. It's sold, but could you make something similar?\n\n${link}`
    : `Hi! I'm interested in "${name}" (${priceText(p)}).\n\n${link}`;
  const dlg = $('dlg');
  dlg.innerHTML = `<button class="close" aria-label="Close" data-close>×</button>
    <div class="dwrap">
      <div class="gal${photos.length > 1 ? ' multi' : ''}">
        <div class="slides" id="slides">${photos.length ? photos.map((ph, i) => `<img src="${esc(photoUrl(ph))}" alt="${esc(name)}, photo ${i + 1}">`).join('') : '<div class="none">Photo coming soon</div>'}</div>
        ${photos.length > 1 ? `<button class="arrow l" data-go="-1" aria-label="Previous photo">‹</button><button class="arrow r" data-go="1" aria-label="Next photo">›</button>
          <div class="dots" id="dots">${photos.map((_, i) => `<i${i ? '' : ' class="on"'}></i>`).join('')}</div>` : ''}
      </div>
      <div class="dinfo">
        <h2>${esc(name)}</h2>
        <div><span class="dprice">${sold ? '' : esc(priceText(p))}</span><span class="status ${sold ? 'sold' : 'available'}">${sold ? 'Sold' : 'Available'}</span></div>
        ${p.materials ? `<div class="label">Materials</div><div>${esc(p.materials)}</div>` : ''}
        ${p.description ? `<div class="label">About this piece</div><div class="desc">${esc(p.description)}</div>` : ''}
        <div class="dbtns">
          <a class="btn primary" href="${esc(mailto((sold ? 'Something like ' : 'About ') + '"' + name + '"', ask))}">${ICON.mail}${sold ? 'Ask about something similar' : 'Ask about this piece'}</a>
          <a class="btn" href="${IG_URL}" target="_blank" rel="noopener">${ICON.ig}Message me on Instagram</a>
        </div>
      </div>
    </div>`;
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
  const slides = $('slides'), dots = $('dots');
  if (dots) slides.addEventListener('scroll', () => {
    const i = Math.round(slides.scrollLeft / slides.clientWidth);
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive: true });
}

function fromHash() {
  const m = /^#p=(.+)$/.exec(location.hash), dlg = $('dlg');
  const p = m && pieces.find(x => x.id === decodeURIComponent(m[1]));
  if (p) openPiece(p); else if (dlg.open) dlg.close();
}

document.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) { history.pushState(null, '', '#p=' + card.dataset.id); fromHash(); return; }
  const chip = e.target.closest('.chip');
  if (chip) { filter = chip.dataset.f; document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip)); render(); return; }
  const go = e.target.closest('[data-go]');
  if (go) { const s = $('slides'); s.scrollBy({ left: s.clientWidth * +go.dataset.go, behavior: 'smooth' }); return; }
  if (e.target.closest('[data-close]') || e.target === $('dlg')) closePiece();
});
function closePiece() { if (location.hash) history.back(); else $('dlg').close(); }
$('dlg').addEventListener('cancel', e => { e.preventDefault(); closePiece(); });
window.addEventListener('popstate', fromHash);

render();
load();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
